<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nous · 笔迹采集台</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#f0eee9;color:#292c2b;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1320px;margin:auto;padding:28px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:27px;font-weight:600;margin:0;letter-spacing:-.6px}.eyebrow{font-size:11px;letter-spacing:2px;color:#5f7770}p{margin:6px 0;color:#69716c}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.paper{background:#fffdfa;border:1px solid #d9ddd6;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #263c2d07}.bar{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #e8eae4;font-size:13px}#status{flex:1}#pad{width:100%;height:540px;display:block;touch-action:none;cursor:crosshair;background-image:radial-gradient(#d6ddd6 .6px,transparent .6px);background-size:24px 24px}aside{padding:20px;background:#e7ebe4;border-radius:16px}label{display:block;font-size:12px;color:#596760;margin:14px 0 5px}input,select,button{font:inherit;border-radius:8px;border:1px solid #cbd2ca;padding:8px 10px;background:#fffdf8;color:#293c32;width:100%}button{cursor:pointer;background:#244c3c;color:white;border:0;margin-top:10px}button.secondary{background:#f8faf5;color:#345344;border:1px solid #cbd2ca}button:disabled{opacity:.45;cursor:default}h2{font-size:15px;margin:22px 0 8px}ul{padding-left:18px;font-size:13px;color:#5a655d}small{display:block;font-size:12px;color:#6e766f;margin-top:12px}.stats{font-variant-numeric:tabular-nums;font-size:12px;color:#607166}#notice{color:#885611;background:#fff0cf;padding:8px 12px;border-radius:8px;margin-bottom:12px}#notice[hidden]{display:none}#saved-list button{font-size:12px;text-align:left;background:#f6f8f3;color:#345344;margin-top:6px}#message{font-size:12px;overflow-wrap:anywhere;min-height:38px;margin-top:12px}footer{font-size:12px;color:#798278;margin-top:16px}@media(max-width:800px){.layout{grid-template-columns:1fr}#pad{height:440px}header{display:block}main{padding:16px}aside{display:grid;gap:8px}h2{margin-top:8px}}
</style></head><body><main>
<header><div><div class="eyebrow">NOUS / INK LAB</div><h1>笔迹采集台</h1><p>留下真实输入，检查预测何时跟得上、何时偏离。</p></div><span class="stats">独立实验工具 · 数据保存在本机</span></header>
<div id="notice" hidden>自动化检查模式：本页生成的数据不计入真实设备实测。</div>
<div class="layout"><section class="paper"><div class="bar"><span id="status" aria-live="polite">待采集</span><span class="stats" id="counts">0 笔 · 0 个事件</span></div><canvas id="pad" aria-label="笔迹采集画布"></canvas></section>
<aside><div><label for="device">设备名称</label><input id="device" placeholder="例如：Mac 触控板 / Wacom 笔"><label for="task">这一笔的动作</label><select id="task"><option value="free">自由画</option><option value="pause_resume">不抬笔暂停，再继续</option><option value="slow_curve">缓慢圆弧</option><option value="fast_curve">快速圆弧</option><option value="zigzag">折线与反向</option><option value="stationary">保持不动</option></select>
<label for="filter">接收输入</label><select id="filter"><option value="any">鼠标、笔、触摸</option><option value="mouse">仅鼠标类输入</option><option value="pen">仅触控笔</option></select>
<button id="start">开始采集</button><button id="stop" class="secondary" disabled>暂停采集</button><button id="save" class="secondary" disabled>保存到本机并新建</button><button id="download" class="secondary" disabled>下载原始记录</button><div id="message" role="status"></div></div>
<div><h2>建议每个动作重复 3 次</h2><ul><li>先正常画几笔，保留自己的速度。</li><li>暂停实验保持按下，停约一秒后再继续。</li><li>鼠标与触控笔分别命名、分别保存。</li></ul><small id="capabilities"></small><h2>已保存 · 点击回放</h2><div id="saved-list"></div></div></aside></div>
<footer>记录原始事件及合并采样。回调时间是软件时间，不等于屏幕实际显示时间。每次连续采集最多 90 秒。</footer>
</main><script type="module" src="/capture.mjs"></script></body></html>
