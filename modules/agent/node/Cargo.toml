[package]
name = "noemori-agent-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
noemori-agent = { path = ".." }
napi = { version = "2.16.17", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "2.16.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2.1.6"
