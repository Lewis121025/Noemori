[package]
name = "noemori-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Noemori 自定义模型接入、Agent 循环与工具契约"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.22"
aws-credential-types = "1"
aws-sigv4 = "1.6.0"
aws-smithy-eventstream = "0.61.4"
bytes = "1"
eventsource-stream = "0.2.3"
encoding_rs = "0.8"
futures = "0.3.34"
http = "1"
hyper-util = { version = "0.1", features = ["client-proxy-system"] }
imagesize = "0.15.0"
jsonschema = { version = "0.58.2", default-features = false }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "system-proxy"] }
schemars = "1.2.2"
scraper = "0.27.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt", "process", "io-util", "net", "signal"] }
tokio-util = "0.7.19"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
nix = { version = "0.31.3", features = ["signal", "process", "term", "fs"] }
pty-process = "0.5.3"
rustix = { version = "1.1.5", features = ["process", "fs", "termios"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5.0"

[dev-dependencies]
aws-smithy-types = "1"
tokio = { version = "1.53.1", features = ["full", "test-util"] }

[[test]]
name = "contracts"
path = "../../test/agent/tool/unit/contracts.rs"

[[test]]
name = "runtime"
path = "../../test/agent/runtime/integration/loop.rs"

[[test]]
name = "providers"
path = "../../test/agent/llm/integration/providers.rs"

[[test]]
name = "model_contracts"
path = "../../test/agent/llm/unit/contract.rs"

[[test]]
name = "messages"
path = "../../test/agent/message/unit/history.rs"

[[test]]
name = "media"
path = "../../test/agent/message/unit/media.rs"

[[test]]
name = "web"
path = "../../test/agent/web/unit/contracts.rs"

[[test]]
name = "web_agent"
path = "../../test/agent/web/integration/agent.rs"

[[test]]
name = "terminal_contracts"
path = "../../test/agent/terminal/unit/contracts.rs"

[[test]]
name = "terminal"
path = "../../test/agent/terminal/integration/processes.rs"

[[test]]
name = "terminal_agent"
path = "../../test/agent/terminal/integration/agent.rs"

[[bin]]
name = "noemori-terminal-sandbox"
path = "src/bin/terminal_sandbox.rs"

[[test]]
name = "terminal_sandbox"
path = "../../test/agent/terminal/integration/sandbox.rs"
