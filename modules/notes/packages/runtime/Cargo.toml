[package]
name = "noemori-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Noemori 应用会话、库生命周期与后台调度"

[dependencies]
noemori-vault = { path = "../vault" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.0"
tempfile = "3.23.0"
trash = "5.2.9"
thiserror = "2"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true

[[test]]
name = "runtime_contracts"
path = "../../../../test/notes/runtime/integration/contracts.rs"
