[package]
name = "noemori-vault-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Noemori 内核的 Node-API 薄绑定"

[lib]
crate-type = ["cdylib"]

[dependencies]
noemori-vault = { path = "../vault" }
napi = { version = "2.16.17", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "2.16.13"
serde_json = "1"
noemori-runtime = { path = "../runtime" }
noemori-ink = { path = "../../../whiteboard/ink/runtime" }

[build-dependencies]
napi-build = "2.1.6"

[dev-dependencies]
tempfile = "3.23.0"
