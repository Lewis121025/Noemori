[package]
name = "noemori-ink"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "api-27"] }
image = { version = "0.25.8", default-features = false }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
sha2 = "0.10.9"

[dev-dependencies]
serde_json = "1"
image = { version = "0.25.8", default-features = false, features = ["png"] }

[[test]]
name = "ink_runtime"
path = "../../../../test/whiteboard/ink/integration/runtime_test.rs"
