[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[test]]
name = "vault_unit_entries"
path = "../../tests/vault/unit/entries.rs"

[[test]]
name = "vault_unit_attachments"
path = "../../tests/vault/unit/attachments.rs"

[[test]]
name = "vault_unit_bookmarks"
path = "../../tests/vault/unit/bookmarks.rs"

[dependencies]
markdown = "1.0.0"
notify = "8.2.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap"] }
tempfile = "3.23.0"
yaml-rust2 = "0.13"

[[test]]
name = "search_performance_scale"
path = "../../tests/search/performance/scale.rs"

[[test]]
name = "search_performance_occurrences"
path = "../../tests/search/performance/occurrences.rs"

