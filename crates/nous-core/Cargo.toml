[package]
name = "nous-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Nous 库内核：磁盘、链接索引与改名事务"

[lints]
workspace = true

[lib]
name = "nous_core"
path = "src/lib.rs"

