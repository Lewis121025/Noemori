[[test]]
name = "search_integration_paging"
path = "../../tests/search/integration/paging.rs"

[[test]]
name = "vault_performance_files"
path = "../../tests/vault/performance/files.rs"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
