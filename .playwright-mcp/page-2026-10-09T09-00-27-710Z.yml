            - text: to refresh from disk. When present, the server reads
            - code [ref=f4e2849]: interface
            - text: and
            - code [ref=f4e2850]: dependencies
            - text: from
            - code [ref=f4e2851]: SKILL.json
            - text: .
          - generic [ref=f4e2852]:
            - code [ref=f4e2853]:
              - generic [ref=f4e2854]: "{ \"method\": \"skills/list\", \"id\": 25, \"params\": {"
