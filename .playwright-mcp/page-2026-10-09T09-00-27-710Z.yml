            - text: to scan extra absolute paths as
            - code [ref=f4e2842]: user
            - text: scope for specific
            - code [ref=f4e2843]: cwd
            - text: values. App-server ignores entries whose
            - code [ref=f4e2844]: cwd
            - text: isn’t present in
            - code [ref=f4e2845]: cwds
            - text: .
            - code [ref=f4e2846]: skills/list
            - text: may reuse a cached result per
            - code [ref=f4e2847]: cwd
            - text: ; set
