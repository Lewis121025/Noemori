            - generic [ref=f4e2820]:
              - button "Copy code to clipboard" [ref=f4e2821] [cursor=pointer]
              - status [ref=f4e2824]
          - paragraph [ref=f4e2825]:
            - text: If you omit the
            - code [ref=f4e2826]: skill
            - text: item, the model will still parse the
            - code [ref=f4e2827]: $<skill-name>
            - text: marker and try to locate the skill, which can add latency.
          - paragraph [ref=f4e2828]: "Example:"
          - generic [ref=f4e2829]:
            - code [ref=f4e2830]:
              - generic [ref=f4e2831]: $skill-creator Add a new skill for triaging flaky CI and include step-by-step usage.
            - generic [ref=f4e2832]:
              - button "Copy code to clipboard" [ref=f4e2833] [cursor=pointer]
              - status [ref=f4e2836]
          - paragraph [ref=f4e2837]:
            - text: Use
            - code [ref=f4e2838]: skills/list
            - text: to fetch available skills (optionally scoped by
            - code [ref=f4e2839]: cwds
            - text: ", with"
            - code [ref=f4e2840]: forceReload
            - text: ). You can also include
