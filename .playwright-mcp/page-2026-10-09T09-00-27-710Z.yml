              - generic [ref=f4e2814]: "\"name\": \"skill-creator\","
              - generic [ref=f4e2815]: "\"path\": \"/Users/me/.codex/skills/skill-creator/SKILL.md\""
              - generic [ref=f4e2816]: "}"
