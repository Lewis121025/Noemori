              - text: where
              - code [ref=f4e2400]: turn.status
              - text: is
              - code [ref=f4e2401]: completed
              - text: ","
              - code [ref=f4e2402]: interrupted
              - text: ", or"
              - code [ref=f4e2403]: failed
              - text: ; failures carry
