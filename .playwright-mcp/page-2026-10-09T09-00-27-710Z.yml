              - /url: https://developers.openai.com/cookbook/articles/sign-in-with-chatgpt
            - text: . App-server authentication has never been permitted for commercial or hosted services. We launched Sign in with ChatGPT to support these use cases, and we’re excited to see what you build. Join our partner waitlist
            - link "here" [ref=f4e3365] [cursor=pointer]:
              - /url: https://openai.com/form/sign-in-with-chatgpt-interest/
            - text: .
          - paragraph [ref=f4e3366]:
            - text: The JSON-RPC auth/account surface exposes request/response methods plus server-initiated notifications (no
            - code [ref=f4e3367]: id
            - text: ). Use these to determine auth state, start or cancel logins, logout, inspect ChatGPT rate limits, and notify workspace owners about depleted credits or usage limits.
          - heading "Authentication modes Copy link to Authentication modes" [level=3] [ref=f4e3368]:
            - generic [ref=f4e3369]: Authentication modes
            - button "Copy link to Authentication modes" [ref=f4e3370] [cursor=pointer]
          - paragraph [ref=f4e3373]:
            - text: Codex supports these authentication modes.
            - code [ref=f4e3374]: account/updated.authMode
            - text: shows the active mode and includes the current ChatGPT
            - code [ref=f4e3375]: planType
            - text: when available.
            - code [ref=f4e3376]: account/read
            - text: also reports account and plan details.
          - list [ref=f4e3377]:
            - listitem [ref=f4e3378]:
              - strong [ref=f4e3379]:
                - text: API key (
                - code [ref=f4e3380]: apikey
                - text: )
              - text: "- the caller supplies an OpenAI API key with"
              - code [ref=f4e3381]: "type: \"apiKey\""
              - text: ", and Codex stores it for API requests."
            - listitem [ref=f4e3382]:
              - strong [ref=f4e3383]:
                - text: ChatGPT managed (
                - code [ref=f4e3384]: chatgpt
                - text: )
              - text: "- Codex owns the ChatGPT OAuth flow, persists tokens, and refreshes them automatically. Start with"
              - code [ref=f4e3385]: "type: \"chatgpt\""
              - text: for the browser flow or
              - code [ref=f4e3386]: "type: \"chatgptDeviceCode\""
              - text: for the device-code flow.
            - listitem [ref=f4e3387]:
              - strong [ref=f4e3388]:
                - text: ChatGPT external tokens (
                - code [ref=f4e3389]: chatgptAuthTokens
                - text: )
              - text: "- experimental and intended for host apps that already own the user’s ChatGPT auth lifecycle. The host app supplies an"
              - code [ref=f4e3390]: accessToken
              - text: ","
              - code [ref=f4e3391]: chatgptAccountId
              - text: ", and optional"
              - code [ref=f4e3392]: chatgptPlanType
              - text: directly, and must refresh the token when asked.
            - listitem [ref=f4e3393]:
              - strong [ref=f4e3394]: Amazon Bedrock
              - text: "-"
              - code [ref=f4e3395]: account/read
              - text: reports Bedrock accounts as
              - code [ref=f4e3396]: "type: \"amazonBedrock\""
              - text: and indicates whether credentials come from a Codex-managed Bedrock API key (
              - code [ref=f4e3397]: "credentialSource: \"codexManaged\""
              - text: ) or the external AWS credential chain (
              - code [ref=f4e3398]: "credentialSource: \"awsManaged\""
              - text: ).
              - code [ref=f4e3399]: account/updated.authMode
              - text: uses
              - code [ref=f4e3400]: bedrockApiKey
              - text: for Codex-managed Bedrock API keys.
