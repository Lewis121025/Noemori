              - text: (notify) - emitted whenever auth mode changes (
              - code [ref=f4e3425]: authMode
              - text: ":"
              - code [ref=f4e3426]: apikey
              - text: ","
              - code [ref=f4e3427]: chatgpt
              - text: ","
              - code [ref=f4e3428]: chatgptAuthTokens
              - text: ","
              - code [ref=f4e3429]: agentIdentity
              - text: ","
              - code [ref=f4e3430]: personalAccessToken
              - text: ","
