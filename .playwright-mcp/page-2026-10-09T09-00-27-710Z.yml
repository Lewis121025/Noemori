            - code [ref=f4e2801]:
              - generic [ref=f4e2802]: "{"
              - generic [ref=f4e2803]: "\"method\": \"turn/start\","
              - generic [ref=f4e2804]: "\"id\": 101,"
              - generic [ref=f4e2805]: "\"params\": {"
              - generic [ref=f4e2806]: "\"threadId\": \"thread-1\","
              - generic [ref=f4e2807]: "\"input\": ["
              - generic [ref=f4e2808]: "{"
              - generic [ref=f4e2809]: "\"type\": \"text\","
              - generic [ref=f4e2810]: "\"text\": \"$skill-creator Add a new skill for triaging flaky CI.\""
              - generic [ref=f4e2811]: "},"
              - generic [ref=f4e2812]: "{"
