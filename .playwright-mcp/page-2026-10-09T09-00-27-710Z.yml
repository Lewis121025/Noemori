          - heading "Apps (connectors) Copy link to Apps (connectors)" [level=2] [ref=f4e2920]:
            - generic [ref=f4e2921]: Apps (connectors)
            - button "Copy link to Apps (connectors)" [ref=f4e2922] [cursor=pointer]
          - paragraph [ref=f4e2925]:
            - text: Use
            - code [ref=f4e2926]: app/installed
            - text: to read the latest committed installed app runtime snapshot. Each result includes the app
            - code [ref=f4e2927]: id
            - text: ","
            - code [ref=f4e2928]: runtimeName
            - text: (or
            - code [ref=f4e2929]: "null"
            - text: ), effective
            - code [ref=f4e2930]: enabled
            - text: state, and
            - code [ref=f4e2931]: callable
            - text: state. An app is callable only when effective configuration enables it and at least one model-visible tool complies with the app and tool policies.
          - generic [ref=f4e2932]:
            - code [ref=f4e2933]:
              - generic [ref=f4e2934]: "{"
              - generic [ref=f4e2935]: "\"method\": \"app/installed\","
