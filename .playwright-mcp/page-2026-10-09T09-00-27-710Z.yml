            - listitem [ref=f4e2580]:
              - code [ref=f4e2581]: UsageLimitExceeded
            - listitem [ref=f4e2582]:
              - code [ref=f4e2583]: HttpConnectionFailed
              - text: (4xx/5xx upstream errors)
            - listitem [ref=f4e2584]:
              - code [ref=f4e2585]: ResponseStreamConnectionFailed
            - listitem [ref=f4e2586]:
              - code [ref=f4e2587]: ResponseStreamDisconnected
            - listitem [ref=f4e2588]:
              - code [ref=f4e2589]: ResponseTooManyFailedAttempts
            - listitem [ref=f4e2590]:
              - code [ref=f4e2591]: BadRequest
              - text: ","
              - code [ref=f4e2592]: Unauthorized
              - text: ","
              - code [ref=f4e2593]: SandboxError
              - text: ","
              - code [ref=f4e2594]: InternalServerError
              - text: ","
              - code [ref=f4e2595]: Other
