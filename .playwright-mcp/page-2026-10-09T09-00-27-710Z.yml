            - code [ref=f4e2572]: "{ error: { message, codexErrorInfo?, additionalDetails? } }"
            - text: and then finishes the turn with
            - code [ref=f4e2573]: "status: \"failed\""
            - text: . When an upstream HTTP status is available, it appears in
            - code [ref=f4e2574]: codexErrorInfo.httpStatusCode
            - text: .
          - paragraph [ref=f4e2575]:
            - text: Common
            - code [ref=f4e2576]: codexErrorInfo
            - text: "values include:"
