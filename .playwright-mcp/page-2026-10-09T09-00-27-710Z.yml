          - heading "Events Copy link to Events" [level=2] [ref=f4e2321]:
            - generic [ref=f4e2322]: Events
            - button "Copy link to Events" [ref=f4e2323] [cursor=pointer]
          - paragraph [ref=f4e2326]:
            - text: Event notifications are the server-initiated stream for thread lifecycles, turn lifecycles, and the items within them. After you start or resume a thread, keep reading the active transport stream for
            - code [ref=f4e2327]: thread/started
            - text: ","
            - code [ref=f4e2328]: thread/archived
            - text: ","
            - code [ref=f4e2329]: thread/unarchived
            - text: ","
            - code [ref=f4e2330]: thread/closed
            - text: ","
            - code [ref=f4e2331]: thread/status/changed
            - text: ","
            - code [ref=f4e2332]: turn/*
            - text: ","
            - code [ref=f4e2333]: item/*
            - text: ", and"
            - code [ref=f4e2334]: serverRequest/resolved
            - text: notifications.
          - heading "Notification opt-out Copy link to Notification opt-out" [level=3] [ref=f4e2335]:
