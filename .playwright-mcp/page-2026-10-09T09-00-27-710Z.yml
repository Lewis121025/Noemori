            - listitem [ref=f4e2345]: Unknown method names are ignored.
            - listitem [ref=f4e2346]:
              - text: Applies to the current
              - code [ref=f4e2347]: thread/*
              - text: ","
              - code [ref=f4e2348]: turn/*
              - text: ","
              - code [ref=f4e2349]: item/*
              - text: ", and related v2 notifications."
            - listitem [ref=f4e2350]: Doesn’t apply to requests, responses, or errors.
