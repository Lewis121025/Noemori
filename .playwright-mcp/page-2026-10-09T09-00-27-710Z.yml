          - heading [level=3] [ref=f4e2693]:
            - code [ref=f4e2695]: tool/requestUserInput
            - button "Copy link to tool/requestUserInput" [ref=f4e2696] [cursor=pointer]
          - paragraph [ref=f4e2699]:
            - text: When the client responds to
            - code [ref=f4e2700]: item/tool/requestUserInput
            - text: ", app-server emits"
            - code [ref=f4e2701]: serverRequest/resolved
            - text: with
            - code [ref=f4e2702]: "{ threadId, requestId }"
            - text: . If the pending request is cleared by turn start, turn completion, or turn interruption before the client answers, the server emits the same notification for that cleanup.
          - paragraph [ref=f4e2703]:
            - text: Request params include
            - code [ref=f4e2704]: autoResolutionMs
            - text: as an integer millisecond timeout or
            - code [ref=f4e2705]: "null"
            - text: . When present, host clients can resolve the prompt automatically after that interval if the user doesn’t answer.
          - heading "Permission requests Copy link to Permission requests" [level=3] [ref=f4e2706]:
            - generic [ref=f4e2707]: Permission requests
            - button "Copy link to Permission requests" [ref=f4e2708] [cursor=pointer]
          - paragraph [ref=f4e2711]:
            - text: The built-in
            - code [ref=f4e2712]: request_permissions
            - text: tool sends
            - code [ref=f4e2713]: item/permissions/requestApproval
            - text: with the
            - code [ref=f4e2714]: threadId
            - text: ","
            - code [ref=f4e2715]: turnId
            - text: ","
            - code [ref=f4e2716]: itemId
            - text: ","
            - code [ref=f4e2717]: environmentId
            - text: ","
            - code [ref=f4e2718]: cwd
            - text: ", optional"
            - code [ref=f4e2719]: reason
            - text: ", and requested network or filesystem permissions. Respond with"
            - code [ref=f4e2720]: permissions
            - text: containing only the granted subset. Set
            - code [ref=f4e2721]: scope
            - text: to
            - code [ref=f4e2722]: "\"session\""
            - text: to persist the grant for later turns in the same session; omit it or use
            - code [ref=f4e2723]: "\"turn\""
            - text: for a turn-scoped grant. Permissions that weren’t requested are ignored.
          - heading "MCP server elicitation requests Copy link to MCP server elicitation requests" [level=3] [ref=f4e2724]:
            - generic [ref=f4e2725]: MCP server elicitation requests
            - button "Copy link to MCP server elicitation requests" [ref=f4e2726] [cursor=pointer]
          - paragraph [ref=f4e2729]:
            - text: An MCP server can interrupt a turn with
            - code [ref=f4e2730]: mcpServer/elicitation/request
            - text: . The request includes
            - code [ref=f4e2731]: threadId
            - text: ", an optional"
            - code [ref=f4e2732]: turnId
            - text: ","
            - code [ref=f4e2733]: serverName
            - text: ", and one of these request shapes:"
          - list [ref=f4e2734]:
            - listitem [ref=f4e2735]:
              - code [ref=f4e2736]: "mode: \"form\""
              - text: or
              - code [ref=f4e2737]: "mode: \"openai/form\""
              - text: ", with"
              - code [ref=f4e2738]: message
              - text: and
              - code [ref=f4e2739]: requestedSchema
              - text: .
            - listitem [ref=f4e2740]:
              - code [ref=f4e2741]: "mode: \"url\""
              - text: ", with"
              - code [ref=f4e2742]: message
              - text: ","
              - code [ref=f4e2743]: url
              - text: ", and"
              - code [ref=f4e2744]: elicitationId
              - text: .
          - paragraph [ref=f4e2745]:
            - text: Respond with
            - code [ref=f4e2746]: "action: \"accept\""
            - text: and the requested
            - code [ref=f4e2747]: content
            - text: ", or with"
            - code [ref=f4e2748]: "action: \"decline\""
            - text: or
            - code [ref=f4e2749]: "\"cancel\""
            - text: and
            - code [ref=f4e2750]: "content: null"
            - text: . App-server then emits
            - code [ref=f4e2751]: serverRequest/resolved
            - text: . To receive the
            - code [ref=f4e2752]: openai/form
            - text: variant, opt in with
            - code [ref=f4e2753]: initialize.params.capabilities.mcpServerOpenaiFormElicitation
            - text: .
          - heading "Dynamic tool calls (experimental) Copy link to Dynamic tool calls (experimental)" [level=3] [ref=f4e2754]:
            - generic [ref=f4e2755]: Dynamic tool calls (experimental)
            - button "Copy link to Dynamic tool calls (experimental)" [ref=f4e2756] [cursor=pointer]
          - paragraph [ref=f4e2759]:
            - code [ref=f4e2760]: dynamicTools
            - text: "on"
            - code [ref=f4e2761]: thread/start
            - text: and the corresponding
            - code [ref=f4e2762]: item/tool/call
            - text: request or response flow are experimental APIs.
          - paragraph [ref=f4e2763]: Dynamic tool names and namespace names must follow Responses API naming constraints. Avoid reserved namespace names used by built-in Codex tools.
          - paragraph [ref=f4e2764]: "When a dynamic tool is invoked during a turn, app-server emits:"
          - list [ref=f4e2765]:
            - listitem [ref=f4e2766]:
              - code [ref=f4e2767]: item/started
              - text: with
              - code [ref=f4e2768]: item.type = "dynamicToolCall"
              - text: ","
              - code [ref=f4e2769]: status = "inProgress"
              - text: ", plus"
              - code [ref=f4e2770]: tool
              - text: and
              - code [ref=f4e2771]: arguments
              - text: .
            - listitem [ref=f4e2772]:
              - code [ref=f4e2773]: item/tool/call
              - text: as a server request to the client.
            - listitem [ref=f4e2774]: The client response payload with returned content items.
            - listitem [ref=f4e2775]:
              - code [ref=f4e2776]: item/completed
              - text: with
              - code [ref=f4e2777]: item.type = "dynamicToolCall"
              - text: ", the final"
              - code [ref=f4e2778]: status
              - text: ", and any returned"
              - code [ref=f4e2779]: contentItems
              - text: or
              - code [ref=f4e2780]: success
              - text: value.
          - heading "MCP tool-call approvals (apps) Copy link to MCP tool-call approvals (apps)" [level=3] [ref=f4e2781]:
            - generic [ref=f4e2782]: MCP tool-call approvals (apps)
            - button "Copy link to MCP tool-call approvals (apps)" [ref=f4e2783] [cursor=pointer]
          - paragraph [ref=f4e2786]:
            - text: App (connector) tool calls can also require approval. When an app tool call has side effects, the server may elicit approval with
            - code [ref=f4e2787]: tool/requestUserInput
            - text: and options such as
            - strong [ref=f4e2788]: Accept
            - text: ","
            - strong [ref=f4e2789]: Decline
            - text: ", and"
            - strong [ref=f4e2790]: Cancel
            - text: . Destructive tool annotations always trigger approval even when the tool also advertises less-privileged hints. If the user declines or cancels, the related
            - code [ref=f4e2791]: mcpToolCall
            - text: item completes with an error instead of running the tool.
          - heading "Skills Copy link to Skills" [level=2] [ref=f4e2792]:
