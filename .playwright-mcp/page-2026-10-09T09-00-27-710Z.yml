          - heading "Review Copy link to Review" [level=2] [ref=f4e2034]:
            - generic [ref=f4e2035]: Review
            - button "Copy link to Review" [ref=f4e2036] [cursor=pointer]
          - paragraph [ref=f4e2039]:
            - code [ref=f4e2040]: review/start
            - text: "runs the Codex reviewer for a thread and streams review items. Targets include:"
          - list [ref=f4e2041]:
            - listitem [ref=f4e2042]:
              - code [ref=f4e2043]: uncommittedChanges
            - listitem [ref=f4e2044]:
              - code [ref=f4e2045]: baseBranch
              - text: (diff against a branch)
            - listitem [ref=f4e2046]:
              - code [ref=f4e2047]: commit
              - text: (review a specific commit)
            - listitem [ref=f4e2048]:
              - code [ref=f4e2049]: custom
              - text: (free-form instructions)
          - paragraph [ref=f4e2050]:
            - text: Use
            - code [ref=f4e2051]: "delivery: \"inline\""
            - text: (default) to run the review on the existing thread, or
            - code [ref=f4e2052]: "delivery: \"detached\""
            - text: to fork a new review thread.
          - paragraph [ref=f4e2053]: "Example request/response:"
          - generic [ref=f4e2054]:
            - code [ref=f4e2055]:
              - generic [ref=f4e2056]: "{ \"method\": \"review/start\", \"id\": 40, \"params\": {"
              - generic [ref=f4e2057]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e2058]: "\"delivery\": \"inline\","
              - generic [ref=f4e2059]: "\"target\": { \"type\": \"commit\", \"sha\": \"1234567deadbeef\", \"title\": \"Polish tui colors\" }"
              - generic [ref=f4e2060]: "} }"
              - generic [ref=f4e2061]: "{ \"id\": 40, \"result\": {"
              - generic [ref=f4e2062]: "\"turn\": {"
              - generic [ref=f4e2063]: "\"id\": \"turn_900\","
              - generic [ref=f4e2064]: "\"status\": \"inProgress\","
              - generic [ref=f4e2065]: "\"items\": ["
              - generic [ref=f4e2066]: "{ \"type\": \"userMessage\", \"id\": \"turn_900\", \"content\": [ { \"type\": \"text\", \"text\": \"Review commit 1234567: Polish tui colors\" } ] }"
              - generic [ref=f4e2067]: "],"
              - generic [ref=f4e2068]: "\"error\": null"
              - generic [ref=f4e2069]: "},"
              - generic [ref=f4e2070]: "\"reviewThreadId\": \"thr_123\""
              - generic [ref=f4e2071]: "} }"
            - generic [ref=f4e2072]:
              - button "Copy code to clipboard" [ref=f4e2073] [cursor=pointer]
              - status [ref=f4e2076]
          - paragraph [ref=f4e2077]:
            - text: For a detached review, use
            - code [ref=f4e2078]: "\"delivery\": \"detached\""
            - text: . The response is the same shape, but
            - code [ref=f4e2079]: reviewThreadId
            - text: will be the id of the new review thread (different from the original
            - code [ref=f4e2080]: threadId
            - text: ). The server also emits a
            - code [ref=f4e2081]: thread/started
            - text: notification for that new thread before streaming the review turn.
          - paragraph [ref=f4e2082]:
            - text: Codex streams the usual
            - code [ref=f4e2083]: turn/started
            - text: notification followed by an
            - code [ref=f4e2084]: item/started
            - text: with an
            - code [ref=f4e2085]: enteredReviewMode
            - text: "item:"
          - generic [ref=f4e2086]:
            - code [ref=f4e2087]:
              - generic [ref=f4e2088]: "{"
              - generic [ref=f4e2089]: "\"method\": \"item/started\","
              - generic [ref=f4e2090]: "\"params\": {"
              - generic [ref=f4e2091]: "\"item\": {"
              - generic [ref=f4e2092]: "\"type\": \"enteredReviewMode\","
              - generic [ref=f4e2093]: "\"id\": \"turn_900\","
              - generic [ref=f4e2094]: "\"review\": \"current changes\""
              - generic [ref=f4e2095]: "}"
              - generic [ref=f4e2096]: "}"
              - generic [ref=f4e2097]: "}"
            - generic [ref=f4e2098]:
              - button "Copy code to clipboard" [ref=f4e2099] [cursor=pointer]
              - status [ref=f4e2102]
          - paragraph [ref=f4e2103]:
            - text: When the reviewer finishes, the server emits
            - code [ref=f4e2104]: item/started
            - text: and
            - code [ref=f4e2105]: item/completed
            - text: containing an
            - code [ref=f4e2106]: exitedReviewMode
            - text: "item with the final review text:"
          - generic [ref=f4e2107]:
            - code [ref=f4e2108]:
              - generic [ref=f4e2109]: "{"
              - generic [ref=f4e2110]: "\"method\": \"item/completed\","
              - generic [ref=f4e2111]: "\"params\": {"
              - generic [ref=f4e2112]: "\"item\": {"
              - generic [ref=f4e2113]: "\"type\": \"exitedReviewMode\","
              - generic [ref=f4e2114]: "\"id\": \"turn_900\","
              - generic [ref=f4e2115]: "\"review\": \"Looks solid overall...\""
              - generic [ref=f4e2116]: "}"
              - generic [ref=f4e2117]: "}"
              - generic [ref=f4e2118]: "}"
            - generic [ref=f4e2119]:
              - button "Copy code to clipboard" [ref=f4e2120] [cursor=pointer]
              - status [ref=f4e2123]
          - paragraph [ref=f4e2124]: Use this notification to render the reviewer output in your client.
          - heading "Process execution Copy link to Process execution" [level=2] [ref=f4e2125]:
            - generic [ref=f4e2126]: Process execution
            - button "Copy link to Process execution" [ref=f4e2127] [cursor=pointer]
          - paragraph [ref=f4e2130]:
            - code [ref=f4e2131]: process/*
            - text: is an experimental, explicit process-control API. It requires
            - code [ref=f4e2132]: capabilities.experimentalApi = true
            - text: and runs outside Codex’s sandbox. Use it only when your client intentionally exposes local process control without a sandbox.
          - paragraph [ref=f4e2133]:
            - text: Start a process with
            - code [ref=f4e2134]: process/spawn
            - text: and provide a
            - code [ref=f4e2135]: processHandle
            - text: ", then use that handle for stdin, resize, and kill requests. Output streams through"
            - code [ref=f4e2136]: process/outputDelta
            - text: notifications and completion streams through
            - code [ref=f4e2137]: process/exited
            - text: .
          - generic [ref=f4e2138]:
            - code [ref=f4e2139]:
              - generic [ref=f4e2140]: "{ \"method\": \"process/spawn\", \"id\": 48, \"params\": {"
              - generic [ref=f4e2141]: "\"command\": [\"python3\", \"-m\", \"pytest\", \"-q\"],"
              - generic [ref=f4e2142]: "\"processHandle\": \"pytest-1\","
              - generic [ref=f4e2143]: "\"cwd\": \"/Users/me/project\","
              - generic [ref=f4e2144]: "\"tty\": true"
              - generic [ref=f4e2145]: "} }"
              - generic [ref=f4e2146]: "{ \"id\": 48, \"result\": {} }"
              - generic [ref=f4e2147]: "{ \"method\": \"process/outputDelta\", \"params\": {"
              - generic [ref=f4e2148]: "\"processHandle\": \"pytest-1\","
              - generic [ref=f4e2149]: "\"stream\": \"stdout\","
              - generic [ref=f4e2150]: "\"deltaBase64\": \"Li4u\""
              - generic [ref=f4e2151]: "} }"
              - generic [ref=f4e2152]: "{ \"method\": \"process/exited\", \"params\": {"
              - generic [ref=f4e2153]: "\"processHandle\": \"pytest-1\","
              - generic [ref=f4e2154]: "\"exitCode\": 0"
              - generic [ref=f4e2155]: "} }"
            - generic [ref=f4e2156]:
              - button "Copy code to clipboard" [ref=f4e2157] [cursor=pointer]
              - status [ref=f4e2160]
          - paragraph [ref=f4e2161]:
            - text: Use
            - code [ref=f4e2162]: process/writeStdin
            - text: with
            - code [ref=f4e2163]: deltaBase64
            - text: ","
            - code [ref=f4e2164]: closeStdin
            - text: ", or both to send input. Use"
            - code [ref=f4e2165]: process/resizePty
            - text: for PTY resize events and
            - code [ref=f4e2166]: process/kill
            - text: to terminate a running process.
          - heading "Command execution Copy link to Command execution" [level=2] [ref=f4e2167]:
            - generic [ref=f4e2168]: Command execution
            - button "Copy link to Command execution" [ref=f4e2169] [cursor=pointer]
          - paragraph [ref=f4e2172]:
            - code [ref=f4e2173]: command/exec
            - text: runs a single command (
            - code [ref=f4e2174]: argv
            - text: array) under the server sandbox without creating a thread.
          - generic [ref=f4e2175]:
            - code [ref=f4e2176]:
              - generic [ref=f4e2177]: "{ \"method\": \"command/exec\", \"id\": 50, \"params\": {"
              - generic [ref=f4e2178]: "\"command\": [\"ls\", \"-la\"],"
              - generic [ref=f4e2179]: "\"cwd\": \"/Users/me/project\","
              - generic [ref=f4e2180]: "\"sandboxPolicy\": { \"type\": \"workspaceWrite\" },"
              - generic [ref=f4e2181]: "\"timeoutMs\": 10000"
              - generic [ref=f4e2182]: "} }"
              - generic [ref=f4e2183]: "{ \"id\": 50, \"result\": { \"exitCode\": 0, \"stdout\": \"...\", \"stderr\": \"\" } }"
            - generic [ref=f4e2184]:
              - button "Copy code to clipboard" [ref=f4e2185] [cursor=pointer]
              - status [ref=f4e2188]
          - paragraph [ref=f4e2189]:
            - text: Use
            - code [ref=f4e2190]: sandboxPolicy.type = "externalSandbox"
            - text: if you already sandbox the server process and want Codex to skip its own sandbox enforcement. For external sandbox mode, set
            - code [ref=f4e2191]: networkAccess
            - text: to
            - code [ref=f4e2192]: restricted
            - text: (default) or
            - code [ref=f4e2193]: enabled
            - text: . For
            - code [ref=f4e2194]: readOnly
            - text: and
            - code [ref=f4e2195]: workspaceWrite
            - text: ", use the same optional"
            - code [ref=f4e2196]: access
            - text: /
            - code [ref=f4e2197]: readOnlyAccess
            - text: structure shown above.
          - paragraph [ref=f4e2198]: "Notes:"
          - list [ref=f4e2199]:
            - listitem [ref=f4e2200]:
              - text: The server rejects empty
              - code [ref=f4e2201]: command
              - text: arrays.
            - listitem [ref=f4e2202]:
              - code [ref=f4e2203]: sandboxPolicy
              - text: accepts the same shape used by
              - code [ref=f4e2204]: turn/start
              - text: (for example,
              - code [ref=f4e2205]: dangerFullAccess
              - text: ","
              - code [ref=f4e2206]: readOnly
              - text: ","
              - code [ref=f4e2207]: workspaceWrite
              - text: ","
              - code [ref=f4e2208]: externalSandbox
              - text: ).
            - listitem [ref=f4e2209]:
              - text: When omitted,
              - code [ref=f4e2210]: timeoutMs
              - text: falls back to the server default.
            - listitem [ref=f4e2211]:
              - text: Set
              - code [ref=f4e2212]: "tty: true"
              - text: for PTY-backed sessions, and use
              - code [ref=f4e2213]: processId
              - text: when you plan to follow up with
              - code [ref=f4e2214]: command/exec/write
              - text: ","
              - code [ref=f4e2215]: command/exec/resize
              - text: ", or"
              - code [ref=f4e2216]: command/exec/terminate
              - text: .
            - listitem [ref=f4e2217]:
              - text: Set
              - code [ref=f4e2218]: "streamStdoutStderr: true"
              - text: to receive
              - code [ref=f4e2219]: command/exec/outputDelta
              - text: notifications while the command is running.
