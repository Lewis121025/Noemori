            - text: ),
            - code [ref=f4e2522]: openPage
            - text: (
            - code [ref=f4e2523]: url?
            - text: ), or
            - code [ref=f4e2524]: findInPage
            - text: (
            - code [ref=f4e2525]: url?
            - text: ","
            - code [ref=f4e2526]: pattern?
            - text: ).
          - paragraph [ref=f4e2527]:
            - text: The app server deprecates the legacy
            - code [ref=f4e2528]: thread/compacted
            - text: notification; use the
            - code [ref=f4e2529]: contextCompaction
            - text: item instead.
          - paragraph [ref=f4e2530]: "All items emit two shared lifecycle events:"
          - list [ref=f4e2531]:
