          - paragraph [ref=f4e2960]:
            - text: Omit
            - code [ref=f4e2961]: threadId
            - text: to use the global configuration instead of a loaded thread’s configuration. Set
            - code [ref=f4e2962]: "forceRefresh: true"
            - text: to refresh the connector runtime snapshot before reading it. When global or workspace policy blocks app access, an observed app can still appear with
            - code [ref=f4e2963]: enabled
            - text: and
            - code [ref=f4e2964]: callable
            - text: set to
            - code [ref=f4e2965]: "false"
            - text: .
          - paragraph [ref=f4e2966]:
            - text: Use
            - code [ref=f4e2967]: app/list
            - text: to fetch available apps. In the CLI/TUI,
            - code [ref=f4e2968]: /apps
            - text: is the user-facing picker; in custom clients, call
            - code [ref=f4e2969]: app/list
            - text: directly. Each entry includes both
            - code [ref=f4e2970]: isAccessible
            - text: (available to the user) and
            - code [ref=f4e2971]: isEnabled
            - text: (enabled in
            - code [ref=f4e2972]: config.toml
            - text: ) so clients can distinguish install/access from local enabled state. App entries can also include optional
            - code [ref=f4e2973]: branding
            - text: ","
            - code [ref=f4e2974]: appMetadata
            - text: ", and"
            - code [ref=f4e2975]: labels
            - text: fields.
          - generic [ref=f4e2976]:
            - code [ref=f4e2977]:
