            - text: When an upstream HTTP status is available, the server forwards it in
            - code [ref=f4e2597]: httpStatusCode
            - text: on the relevant
            - code [ref=f4e2598]: codexErrorInfo
            - text: variant.
          - heading "Approvals Copy link to Approvals" [level=2] [ref=f4e2599]:
            - generic [ref=f4e2600]: Approvals
            - button "Copy link to Approvals" [ref=f4e2601] [cursor=pointer]
          - paragraph [ref=f4e2604]: Depending on a user’s Codex settings, command execution and file changes may require approval. The app-server sends a server-initiated JSON-RPC request to the client, and the client responds with a decision payload.
          - list [ref=f4e2605]:
            - listitem [ref=f4e2606]:
              - paragraph [ref=f4e2607]:
                - text: "Command execution decisions:"
                - code [ref=f4e2608]: accept
                - text: ","
                - code [ref=f4e2609]: acceptForSession
                - text: ","
                - code [ref=f4e2610]: decline
                - text: ","
                - code [ref=f4e2611]: cancel
                - text: ", or"
                - code [ref=f4e2612]: "{ \"acceptWithExecpolicyAmendment\": { \"execpolicy_amendment\": [\"cmd\", \"...\"] } }"
                - text: .
            - listitem [ref=f4e2613]:
              - paragraph [ref=f4e2614]:
                - text: "File change decisions:"
                - code [ref=f4e2615]: accept
                - text: ","
                - code [ref=f4e2616]: acceptForSession
                - text: ","
                - code [ref=f4e2617]: decline
                - text: ","
                - code [ref=f4e2618]: cancel
                - text: .
            - listitem [ref=f4e2619]:
              - paragraph [ref=f4e2620]:
                - text: Requests include
                - code [ref=f4e2621]: threadId
                - text: and
                - code [ref=f4e2622]: turnId
                - text: "- use them to scope UI state to the active conversation."
            - listitem [ref=f4e2623]:
              - paragraph [ref=f4e2624]:
                - text: The server resumes or declines the work and ends the item with
                - code [ref=f4e2625]: item/completed
                - text: .
          - heading "Command execution approvals Copy link to Command execution approvals" [level=3] [ref=f4e2626]:
            - generic [ref=f4e2627]: Command execution approvals
            - button "Copy link to Command execution approvals" [ref=f4e2628] [cursor=pointer]
          - paragraph [ref=f4e2631]: "Order of messages:"
          - list [ref=f4e2632]:
            - listitem [ref=f4e2633]:
              - code [ref=f4e2634]: item/started
              - text: shows the pending
              - code [ref=f4e2635]: commandExecution
              - text: item with
              - code [ref=f4e2636]: command
              - text: ","
              - code [ref=f4e2637]: cwd
              - text: ", and other fields."
            - listitem [ref=f4e2638]:
              - code [ref=f4e2639]: item/commandExecution/requestApproval
              - text: includes
              - code [ref=f4e2640]: itemId
              - text: ","
              - code [ref=f4e2641]: threadId
              - text: ","
              - code [ref=f4e2642]: turnId
              - text: ", optional"
              - code [ref=f4e2643]: reason
              - text: ", optional"
              - code [ref=f4e2644]: command
              - text: ", optional"
              - code [ref=f4e2645]: cwd
              - text: ", optional"
              - code [ref=f4e2646]: commandActions
              - text: ", optional"
              - code [ref=f4e2647]: proposedExecpolicyAmendment
              - text: ", optional"
              - code [ref=f4e2648]: networkApprovalContext
              - text: ", and optional"
              - code [ref=f4e2649]: availableDecisions
              - text: . When
              - code [ref=f4e2650]: initialize.params.capabilities.experimentalApi = true
              - text: ", the payload can also include experimental"
              - code [ref=f4e2651]: additionalPermissions
              - text: describing requested per-command sandbox access. Any filesystem paths inside
              - code [ref=f4e2652]: additionalPermissions
              - text: are absolute on the wire.
            - listitem [ref=f4e2653]: Client responds with one of the command execution approval decisions above.
            - listitem [ref=f4e2654]:
              - code [ref=f4e2655]: serverRequest/resolved
              - text: confirms that the pending request has been answered or cleared.
            - listitem [ref=f4e2656]:
              - code [ref=f4e2657]: item/completed
              - text: returns the final
              - code [ref=f4e2658]: commandExecution
              - text: item with
              - code [ref=f4e2659]: "status: completed | failed | declined"
              - text: .
          - paragraph [ref=f4e2660]:
            - text: When
            - code [ref=f4e2661]: networkApprovalContext
            - text: is present, the prompt is for managed network access (not a general shell-command approval). The current v2 schema exposes the target
            - code [ref=f4e2662]: host
            - text: and
            - code [ref=f4e2663]: protocol
            - text: ; clients should render a network-specific prompt and not rely on
            - code [ref=f4e2664]: command
            - text: being a user-meaningful shell command preview.
          - paragraph [ref=f4e2665]:
            - text: Codex groups concurrent network approval prompts by destination (
            - code [ref=f4e2666]: host
            - text: ", protocol, and port). The app-server may therefore send one prompt that unblocks multiple queued requests to the same destination, while different ports on the same host are treated separately."
          - heading "File change approvals Copy link to File change approvals" [level=3] [ref=f4e2667]:
            - generic [ref=f4e2668]: File change approvals
            - button "Copy link to File change approvals" [ref=f4e2669] [cursor=pointer]
          - paragraph [ref=f4e2672]: "Order of messages:"
          - list [ref=f4e2673]:
            - listitem [ref=f4e2674]:
              - code [ref=f4e2675]: item/started
              - text: emits a
              - code [ref=f4e2676]: fileChange
              - text: item with proposed
              - code [ref=f4e2677]: changes
              - text: and
              - code [ref=f4e2678]: "status: \"inProgress\""
              - text: .
            - listitem [ref=f4e2679]:
              - code [ref=f4e2680]: item/fileChange/requestApproval
              - text: includes
              - code [ref=f4e2681]: itemId
              - text: ","
              - code [ref=f4e2682]: threadId
              - text: ","
              - code [ref=f4e2683]: turnId
              - text: ", optional"
              - code [ref=f4e2684]: reason
              - text: ", and optional"
              - code [ref=f4e2685]: grantRoot
              - text: .
            - listitem [ref=f4e2686]: Client responds with one of the file change approval decisions above.
            - listitem [ref=f4e2687]:
              - code [ref=f4e2688]: serverRequest/resolved
              - text: confirms that the pending request has been answered or cleared.
            - listitem [ref=f4e2689]:
              - code [ref=f4e2690]: item/completed
              - text: returns the final
              - code [ref=f4e2691]: fileChange
              - text: item with
