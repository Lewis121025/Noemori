              - text: ","
              - code [ref=f4e3413]: chatgptDeviceCode
              - text: ", or experimental"
              - code [ref=f4e3414]: chatgptAuthTokens
              - text: ).
            - listitem [ref=f4e3415]:
              - code [ref=f4e3416]: account/login/completed
              - text: (notify) - emitted when a login attempt finishes (success or error).
