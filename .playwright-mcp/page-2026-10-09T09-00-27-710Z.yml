              - text: (for example
              - code [ref=f4e3933]: codex
              - text: ).
            - listitem [ref=f4e3934]:
              - code [ref=f4e3935]: limitId
              - text: is the metered bucket identifier.
            - listitem [ref=f4e3936]:
              - code [ref=f4e3937]: limitName
              - text: is an optional user-facing label for the bucket.
            - listitem [ref=f4e3938]:
              - code [ref=f4e3939]: usedPercent
              - text: is current usage within the quota window.
            - listitem [ref=f4e3940]:
              - code [ref=f4e3941]: windowDurationMins
              - text: is the quota window length.
            - listitem [ref=f4e3942]:
              - code [ref=f4e3943]: resetsAt
              - text: is a Unix timestamp (seconds) for the next reset.
            - listitem [ref=f4e3944]:
              - code [ref=f4e3945]: planType
              - text: is included when the server returns the ChatGPT plan associated with a bucket.
            - listitem [ref=f4e3946]:
              - code [ref=f4e3947]: credits
              - text: is included when the server returns remaining workspace credit details.
            - listitem [ref=f4e3948]:
              - code [ref=f4e3949]: rateLimitReachedType
              - text: identifies the server-classified limit state when one has been reached.
            - listitem [ref=f4e3950]:
              - code [ref=f4e3951]: rateLimitResetCredits
              - text: contains the available earned-reset count when the service provides it; otherwise it’s
              - code [ref=f4e3952]: "null"
              - text: .
            - listitem [ref=f4e3953]:
              - code [ref=f4e3954]: rateLimitResetCredits.credits
              - text: is
              - code [ref=f4e3955]: "null"
              - text: when only the count is known. An empty array means the service fetched details and returned no available credits. The service can cap the detail rows, so
              - code [ref=f4e3956]: availableCount
              - text: is authoritative.
            - listitem [ref=f4e3957]:
              - text: Each detail row includes an opaque
              - code [ref=f4e3958]: id
              - text: ","
              - code [ref=f4e3959]: resetType
              - text: ","
              - code [ref=f4e3960]: status
              - text: ","
              - code [ref=f4e3961]: grantedAt
              - text: ","
              - code [ref=f4e3962]: expiresAt
