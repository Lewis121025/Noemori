          - paragraph [ref=f4e1153]:
            - text: Experimental clients can set
            - code [ref=f4e1154]: historyMode
            - text: "on"
            - code [ref=f4e1155]: thread/start
            - text: to
            - code [ref=f4e1156]: "\"legacy\""
            - text: (the default) or
            - code [ref=f4e1157]: "\"paginated\""
            - text: . Paginated thread creation isn’t supported yet and returns JSON-RPC error
            - code [ref=f4e1158]: "-32601"
            - text: . App-server can list and read summaries for existing paginated records, but full-history reads, turn pagination, and resume fail closed until paginated history is supported.
          - paragraph [ref=f4e1159]:
            - text: Beta clients that opt into
            - code [ref=f4e1160]: capabilities.experimentalApi
            - text: can pass a named permission-profile id in
            - code [ref=f4e1161]: permissions
            - text: instead of the legacy
            - code [ref=f4e1162]: sandbox
            - text: field. Don’t send
            - code [ref=f4e1163]: permissions
            - text: and
            - code [ref=f4e1164]: sandbox
            - text: together. Use
            - code [ref=f4e1165]: permissionProfile/list
            - text: with the project
            - code [ref=f4e1166]: cwd
            - text: to discover available profiles and whether managed requirements allow each one.
          - paragraph [ref=f4e1167]:
            - code [ref=f4e1168]: thread.sessionId
            - text: identifies the current live session tree root. Root threads use their own thread id as the session id; forked threads keep the session id of the root they came from. Clients should read the session id from
            - code [ref=f4e1169]: thread.sessionId
            - text: instead of deriving it from the thread id.
          - paragraph [ref=f4e1170]:
            - text: To continue a stored session, call
            - code [ref=f4e1171]: thread/resume
            - text: with the
            - code [ref=f4e1172]: thread.id
            - text: you recorded earlier. The response shape matches
            - code [ref=f4e1173]: thread/start
            - text: . You can also pass the same configuration overrides supported by
            - code [ref=f4e1174]: thread/start
            - text: ", such as"
            - code [ref=f4e1175]: personality
            - text: ":"
          - generic [ref=f4e1176]:
            - code [ref=f4e1177]:
              - generic [ref=f4e1178]: "{ \"method\": \"thread/resume\", \"id\": 11, \"params\": {"
              - generic [ref=f4e1179]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1180]: "\"personality\": \"friendly\""
              - generic [ref=f4e1181]: "} }"
              - generic [ref=f4e1182]: "{ \"id\": 11, \"result\": { \"thread\": { \"id\": \"thr_123\", \"name\": \"Bug bash notes\", \"ephemeral\": false } } }"
            - generic [ref=f4e1183]:
              - button "Copy code to clipboard" [ref=f4e1184] [cursor=pointer]
              - status [ref=f4e1187]
          - paragraph [ref=f4e1188]:
            - text: Resuming a thread doesn’t update
            - code [ref=f4e1189]: thread.updatedAt
            - text: (or the rollout file’s modified time) by itself. The timestamp updates when you start a turn.
          - paragraph [ref=f4e1190]:
            - text: If you mark an enabled MCP server as
            - code [ref=f4e1191]: required
            - text: in config and that server fails to initialize,
            - code [ref=f4e1192]: thread/start
            - text: and
            - code [ref=f4e1193]: thread/resume
            - text: fail instead of continuing without it.
          - paragraph [ref=f4e1194]:
            - code [ref=f4e1195]: dynamicTools
            - text: "on"
            - code [ref=f4e1196]: thread/start
            - text: is an experimental field (requires
            - code [ref=f4e1197]: capabilities.experimentalApi = true
            - text: ). Codex persists these dynamic tools in the thread rollout metadata and restores them on
            - code [ref=f4e1198]: thread/resume
            - text: when you don’t supply new dynamic tools.
          - paragraph [ref=f4e1199]: If you resume with a different model than the one recorded in the rollout, Codex emits a warning and applies a one-time model-switch instruction on the next turn.
          - heading "Manage a thread goal Copy link to Manage a thread goal" [level=3] [ref=f4e1200]:
            - generic [ref=f4e1201]: Manage a thread goal
            - button "Copy link to Manage a thread goal" [ref=f4e1202] [cursor=pointer]
          - paragraph [ref=f4e1205]:
            - text: Use
            - code [ref=f4e1206]: thread/goal/set
            - text: ","
            - code [ref=f4e1207]: thread/goal/get
            - text: ", and"
            - code [ref=f4e1208]: thread/goal/clear
            - text: to manage the same persisted goal state surfaced by
            - code [ref=f4e1209]: /goal
            - text: in the TUI.
          - generic [ref=f4e1210]:
            - code [ref=f4e1211]:
              - generic [ref=f4e1212]: "{ \"method\": \"thread/goal/set\", \"id\": 13, \"params\": {"
              - generic [ref=f4e1213]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1214]: "\"objective\": \"Finish the migration and keep tests green\","
              - generic [ref=f4e1215]: "\"status\": \"active\","
              - generic [ref=f4e1216]: "\"tokenBudget\": 40000"
              - generic [ref=f4e1217]: "} }"
              - generic [ref=f4e1218]: "{ \"id\": 13, \"result\": { \"goal\": {"
              - generic [ref=f4e1219]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1220]: "\"objective\": \"Finish the migration and keep tests green\","
              - generic [ref=f4e1221]: "\"status\": \"active\","
              - generic [ref=f4e1222]: "\"tokenBudget\": 40000,"
              - generic [ref=f4e1223]: "\"tokensUsed\": 0,"
              - generic [ref=f4e1224]: "\"timeUsedSeconds\": 0"
              - generic [ref=f4e1225]: "} } }"
              - generic [ref=f4e1226]: "{ \"method\": \"thread/goal/updated\", \"params\": {"
              - generic [ref=f4e1227]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1228]: "\"goal\": {"
              - generic [ref=f4e1229]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1230]: "\"objective\": \"Finish the migration and keep tests green\","
              - generic [ref=f4e1231]: "\"status\": \"active\","
              - generic [ref=f4e1232]: "\"tokenBudget\": 40000,"
              - generic [ref=f4e1233]: "\"tokensUsed\": 0,"
              - generic [ref=f4e1234]: "\"timeUsedSeconds\": 0"
              - generic [ref=f4e1235]: "}"
              - generic [ref=f4e1236]: "} }"
            - generic [ref=f4e1237]:
              - button "Copy code to clipboard" [ref=f4e1238] [cursor=pointer]
              - status [ref=f4e1241]
          - paragraph [ref=f4e1242]:
            - text: Goal objectives must be non-empty and at most 4,000 characters. Supplying a new objective replaces the goal and resets usage accounting. Supplying the current non-terminal objective, or omitting
            - code [ref=f4e1243]: objective
            - text: ", updates status or token budget while preserving usage history."
          - paragraph [ref=f4e1244]:
            - text: To branch from a stored session, call
            - code [ref=f4e1245]: thread/fork
            - text: with the
            - code [ref=f4e1246]: thread.id
            - text: . This creates a new thread id and emits a
            - code [ref=f4e1247]: thread/started
            - text: notification for it. Pass
            - code [ref=f4e1248]: lastTurnId
            - text: "to copy history through that turn, inclusive, and omit later turns:"
          - generic [ref=f4e1249]:
            - code [ref=f4e1250]:
              - generic [ref=f4e1251]: "{ \"method\": \"thread/fork\", \"id\": 12, \"params\": { \"threadId\": \"thr_123\", \"lastTurnId\": \"turn_456\" } }"
              - generic [ref=f4e1252]: "{ \"id\": 12, \"result\": { \"thread\": { \"id\": \"thr_456\", \"sessionId\": \"thr_123\", \"forkedFromId\": \"thr_123\" } } }"
              - generic [ref=f4e1253]: "{ \"method\": \"thread/started\", \"params\": { \"thread\": { \"id\": \"thr_456\" } } }"
            - generic [ref=f4e1254]:
              - button "Copy code to clipboard" [ref=f4e1255] [cursor=pointer]
              - status [ref=f4e1258]
          - paragraph [ref=f4e1259]:
            - text: App-server rejects an in-progress
            - code [ref=f4e1260]: lastTurnId
            - text: . If you omit the field while the source thread is mid-turn, the fork records an interruption marker instead of retaining an unmarked partial turn.
          - paragraph [ref=f4e1261]:
            - text: Pass
            - code [ref=f4e1262]: "ephemeral: true"
            - text: "to create an in-memory fork without adding it to stored thread listings:"
          - generic [ref=f4e1263]:
            - code [ref=f4e1264]:
              - generic [ref=f4e1265]: "{"
              - generic [ref=f4e1266]: "\"method\": \"thread/fork\","
              - generic [ref=f4e1267]: "\"id\": 13,"
              - generic [ref=f4e1268]: "\"params\": {"
              - generic [ref=f4e1269]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1270]: "\"ephemeral\": true"
              - generic [ref=f4e1271]: "}"
              - generic [ref=f4e1272]: "}"
              - generic [ref=f4e1273]: "{"
              - generic [ref=f4e1274]: "\"id\": 13,"
              - generic [ref=f4e1275]: "\"result\": {"
              - generic [ref=f4e1276]: "\"thread\": {"
              - generic [ref=f4e1277]: "\"id\": \"thr_789\","
              - generic [ref=f4e1278]: "\"sessionId\": \"thr_789\","
              - generic [ref=f4e1279]: "\"forkedFromId\": \"thr_123\","
              - generic [ref=f4e1280]: "\"ephemeral\": true"
              - generic [ref=f4e1281]: "}"
              - generic [ref=f4e1282]: "}"
              - generic [ref=f4e1283]: "}"
            - generic [ref=f4e1284]:
              - button "Copy code to clipboard" [ref=f4e1285] [cursor=pointer]
              - status [ref=f4e1288]
          - paragraph [ref=f4e1289]:
            - text: Ephemeral forks of paginated threads also require
            - code [ref=f4e1290]: "excludeTurns: true"
            - text: . That field is experimental and requires
            - code [ref=f4e1291]: capabilities.experimentalApi = true
            - text: .
          - paragraph [ref=f4e1292]:
            - text: When a user-facing thread title has been set, app-server hydrates
            - code [ref=f4e1293]: thread.name
            - text: "on"
            - code [ref=f4e1294]: thread/list
            - text: ","
            - code [ref=f4e1295]: thread/read
            - text: ","
            - code [ref=f4e1296]: thread/resume
            - text: ","
            - code [ref=f4e1297]: thread/unarchive
            - text: ", and"
            - code [ref=f4e1298]: thread/rollback
            - text: responses.
            - code [ref=f4e1299]: thread/start
            - text: and
            - code [ref=f4e1300]: thread/fork
            - text: may omit
            - code [ref=f4e1301]: name
            - text: (or return
            - code [ref=f4e1302]: "null"
            - text: ) until a title is set later.
          - heading "Read a stored thread (without resuming) Copy link to Read a stored thread (without resuming)" [level=3] [ref=f4e1303]:
            - generic [ref=f4e1304]: Read a stored thread (without resuming)
            - button "Copy link to Read a stored thread (without resuming)" [ref=f4e1305] [cursor=pointer]
          - paragraph [ref=f4e1308]:
            - text: Use
            - code [ref=f4e1309]: thread/read
            - text: when you want stored thread data but don’t want to resume the thread or subscribe to its events.
          - list [ref=f4e1310]:
            - listitem [ref=f4e1311]:
              - code [ref=f4e1312]: includeTurns
              - text: "- when"
              - code [ref=f4e1313]: "true"
              - text: ", the response includes the thread’s turns; when"
              - code [ref=f4e1314]: "false"
              - text: or omitted, you get the thread summary only.
            - listitem [ref=f4e1315]:
              - text: Returned
              - code [ref=f4e1316]: thread
              - text: objects include runtime
              - code [ref=f4e1317]: status
              - text: (
              - code [ref=f4e1318]: notLoaded
              - text: ","
              - code [ref=f4e1319]: idle
              - text: ","
              - code [ref=f4e1320]: systemError
              - text: ", or"
              - code [ref=f4e1321]: active
              - text: with
              - code [ref=f4e1322]: activeFlags
              - text: ).
          - generic [ref=f4e1323]:
            - code [ref=f4e1324]:
              - generic [ref=f4e1325]: "{ \"method\": \"thread/read\", \"id\": 19, \"params\": { \"threadId\": \"thr_123\", \"includeTurns\": true } }"
              - generic [ref=f4e1326]: "{ \"id\": 19, \"result\": { \"thread\": { \"id\": \"thr_123\", \"name\": \"Bug bash notes\", \"ephemeral\": false, \"status\": { \"type\": \"notLoaded\" }, \"turns\": [] } } }"
            - generic [ref=f4e1327]:
              - button "Copy code to clipboard" [ref=f4e1328] [cursor=pointer]
              - status [ref=f4e1331]
          - paragraph [ref=f4e1332]:
            - text: Unlike
            - code [ref=f4e1333]: thread/resume
            - text: ","
            - code [ref=f4e1334]: thread/read
            - text: doesn’t load the thread into memory or emit
            - code [ref=f4e1335]: thread/started
            - text: .
          - heading "List thread turns Copy link to List thread turns" [level=3] [ref=f4e1336]:
            - generic [ref=f4e1337]: List thread turns
            - button "Copy link to List thread turns" [ref=f4e1338] [cursor=pointer]
          - paragraph [ref=f4e1341]:
            - code [ref=f4e1342]: thread/turns/list
            - text: is experimental. Use it to page a stored thread’s turn history without resuming it. Results default to newest-first so clients can fetch older turns with
            - code [ref=f4e1343]: nextCursor
            - text: . The response also includes
            - code [ref=f4e1344]: backwardsCursor
            - text: ; pass it as
            - code [ref=f4e1345]: cursor
            - text: with
            - code [ref=f4e1346]: "sortDirection: \"asc\""
            - text: to fetch turns newer than the first item from the earlier page.
          - paragraph [ref=f4e1347]:
            - code [ref=f4e1348]: itemsView
            - text: "controls how much turn-item data the response includes:"
          - list [ref=f4e1349]:
            - listitem [ref=f4e1350]:
              - code [ref=f4e1351]: notLoaded
              - text: omits items.
            - listitem [ref=f4e1352]:
              - code [ref=f4e1353]: summary
              - text: returns summarized item data and is the default when omitted.
            - listitem [ref=f4e1354]:
              - code [ref=f4e1355]: full
              - text: returns full item data.
          - generic [ref=f4e1356]:
            - code [ref=f4e1357]:
              - generic [ref=f4e1358]: "{ \"method\": \"thread/turns/list\", \"id\": 20, \"params\": {"
              - generic [ref=f4e1359]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1360]: "\"limit\": 50,"
              - generic [ref=f4e1361]: "\"sortDirection\": \"desc\","
              - generic [ref=f4e1362]: "\"itemsView\": \"summary\""
              - generic [ref=f4e1363]: "} }"
              - generic [ref=f4e1364]: "{ \"id\": 20, \"result\": {"
              - generic [ref=f4e1365]: "\"data\": [],"
              - generic [ref=f4e1366]: "\"nextCursor\": \"older-turns-cursor-or-null\","
              - generic [ref=f4e1367]: "\"backwardsCursor\": \"newer-turns-cursor-or-null\""
              - generic [ref=f4e1368]: "} }"
            - generic [ref=f4e1369]:
              - button "Copy code to clipboard" [ref=f4e1370] [cursor=pointer]
              - status [ref=f4e1373]
          - paragraph [ref=f4e1374]:
            - code [ref=f4e1375]: thread/items/list
            - text: is also experimental. It pages persisted items without resuming the thread. Pass
            - code [ref=f4e1376]: turnId
            - text: to restrict results to one turn, or omit it to page items across the thread. The active thread store must support item pagination; otherwise, the server returns an unsupported-method error.
          - heading "List threads (with pagination & filters) Copy link to List threads (with pagination & filters)" [level=3] [ref=f4e1377]:
            - generic [ref=f4e1378]: List threads (with pagination & filters)
            - button "Copy link to List threads (with pagination & filters)" [ref=f4e1379] [cursor=pointer]
          - paragraph [ref=f4e1382]:
            - code [ref=f4e1383]: thread/list
            - text: lets you render a history UI. Results default to newest-first by
            - code [ref=f4e1384]: createdAt
            - text: ". Filters apply before pagination. Pass any combination of:"
          - list [ref=f4e1385]:
            - listitem [ref=f4e1386]:
              - code [ref=f4e1387]: cursor
              - text: "- opaque string from a prior response; omit for the first page."
            - listitem [ref=f4e1388]:
              - code [ref=f4e1389]: limit
              - text: "- server defaults to a reasonable page size if unset."
            - listitem [ref=f4e1390]:
              - code [ref=f4e1391]: sortKey
              - text: "-"
              - code [ref=f4e1392]: created_at
              - text: (default),
              - code [ref=f4e1393]: updated_at
              - text: ", or"
              - code [ref=f4e1394]: recency_at
              - text: .
            - listitem [ref=f4e1395]:
              - code [ref=f4e1396]: sortDirection
              - text: "-"
              - code [ref=f4e1397]: desc
              - text: (default) or
              - code [ref=f4e1398]: asc
              - text: .
            - listitem [ref=f4e1399]:
              - code [ref=f4e1400]: modelProviders
              - text: "- restrict results to specific providers; unset, null, or an empty array includes all providers."
            - listitem [ref=f4e1401]:
              - code [ref=f4e1402]: sourceKinds
              - text: "- restrict results to specific thread sources. When omitted or"
              - code [ref=f4e1403]: "[]"
              - text: ", the server defaults to interactive sources only:"
              - code [ref=f4e1404]: cli
              - text: and
              - code [ref=f4e1405]: vscode
              - text: .
            - listitem [ref=f4e1406]:
              - code [ref=f4e1407]: archived
              - text: "- when"
              - code [ref=f4e1408]: "true"
              - text: ", list archived threads only. When"
              - code [ref=f4e1409]: "false"
              - text: or omitted, list non-archived threads (default).
            - listitem [ref=f4e1410]:
              - code [ref=f4e1411]: isPinned
              - text: "- when provided, return only threads with the matching persisted pin state. Omit it to return pinned and unpinned threads."
            - listitem [ref=f4e1412]:
              - code [ref=f4e1413]: cwd
              - text: "- restrict results to threads whose session current working directory exactly matches this path, or one of the paths in an array. Relative paths resolve from the app-server process working directory."
            - listitem [ref=f4e1414]:
              - code [ref=f4e1415]: useStateDbOnly
              - text: "- when"
              - code [ref=f4e1416]: "true"
              - text: ", return state database results without scanning JSONL thread logs to repair metadata. Omit it or pass"
              - code [ref=f4e1417]: "false"
              - text: for the default scan-and-repair behavior.
            - listitem [ref=f4e1418]:
              - code [ref=f4e1419]: searchTerm
              - text: "- restrict results to threads whose extracted title contains this case-sensitive text fragment."
            - listitem [ref=f4e1420]:
              - code [ref=f4e1421]: parentThreadId
              - text: "- restrict results to direct child threads of the given parent thread. This filter is experimental and requires"
              - code [ref=f4e1422]: capabilities.experimentalApi = true
              - text: .
            - listitem [ref=f4e1423]:
              - code [ref=f4e1424]: ancestorThreadId
              - text: "- restrict results to spawned descendants of the given thread at any depth. This filter is experimental and requires"
              - code [ref=f4e1425]: capabilities.experimentalApi = true
              - text: ; don’t combine it with
              - code [ref=f4e1426]: parentThreadId
              - text: .
          - paragraph [ref=f4e1427]:
            - code [ref=f4e1428]: sourceKinds
            - text: "accepts the following values:"
          - list [ref=f4e1429]:
            - listitem [ref=f4e1430]:
              - code [ref=f4e1431]: cli
            - listitem [ref=f4e1432]:
              - code [ref=f4e1433]: vscode
            - listitem [ref=f4e1434]:
              - code [ref=f4e1435]: exec
            - listitem [ref=f4e1436]:
              - code [ref=f4e1437]: appServer
            - listitem [ref=f4e1438]:
              - code [ref=f4e1439]: subAgent
            - listitem [ref=f4e1440]:
              - code [ref=f4e1441]: subAgentReview
            - listitem [ref=f4e1442]:
              - code [ref=f4e1443]: subAgentCompact
            - listitem [ref=f4e1444]:
              - code [ref=f4e1445]: subAgentThreadSpawn
            - listitem [ref=f4e1446]:
              - code [ref=f4e1447]: subAgentOther
            - listitem [ref=f4e1448]:
              - code [ref=f4e1449]: unknown
          - paragraph [ref=f4e1450]: "Example:"
          - generic [ref=f4e1451]:
            - code [ref=f4e1452]:
              - generic [ref=f4e1453]: "{ \"method\": \"thread/list\", \"id\": 20, \"params\": {"
              - generic [ref=f4e1454]: "\"cursor\": null,"
              - generic [ref=f4e1455]: "\"limit\": 25,"
              - generic [ref=f4e1456]: "\"sortKey\": \"created_at\""
              - generic [ref=f4e1457]: "} }"
              - generic [ref=f4e1458]: "{ \"id\": 20, \"result\": {"
              - generic [ref=f4e1459]: "\"data\": ["
              - generic [ref=f4e1460]: "{ \"id\": \"thr_a\", \"preview\": \"Create a TUI\", \"ephemeral\": false, \"isPinned\": true, \"modelProvider\": \"openai\", \"createdAt\": 1730831111, \"updatedAt\": 1730831111, \"name\": \"TUI prototype\", \"status\": { \"type\": \"notLoaded\" } },"
              - generic [ref=f4e1461]: "{ \"id\": \"thr_b\", \"preview\": \"Fix tests\", \"ephemeral\": false, \"isPinned\": false, \"modelProvider\": \"openai\", \"createdAt\": 1730750000, \"updatedAt\": 1730750000, \"status\": { \"type\": \"notLoaded\" } }"
              - generic [ref=f4e1462]: "],"
              - generic [ref=f4e1463]: "\"nextCursor\": \"opaque-token-or-null\""
              - generic [ref=f4e1464]: "} }"
            - generic [ref=f4e1465]:
              - button "Copy code to clipboard" [ref=f4e1466] [cursor=pointer]
              - status [ref=f4e1469]
          - paragraph [ref=f4e1470]:
            - text: When
            - code [ref=f4e1471]: nextCursor
            - text: is
            - code [ref=f4e1472]: "null"
            - text: ", you have reached the final page."
          - heading "Update stored thread metadata Copy link to Update stored thread metadata" [level=3] [ref=f4e1473]:
            - generic [ref=f4e1474]: Update stored thread metadata
            - button "Copy link to Update stored thread metadata" [ref=f4e1475] [cursor=pointer]
          - paragraph [ref=f4e1478]:
            - text: Use
            - code [ref=f4e1479]: thread/metadata/update
            - text: to patch stored thread metadata without resuming the thread. Set
            - code [ref=f4e1480]: isPinned
            - text: to pin or unpin the thread, or update
            - code [ref=f4e1481]: gitInfo
            - text: to change persisted Git metadata. Omitted fields stay unchanged; explicit
            - code [ref=f4e1482]: "null"
            - text: clears a stored Git metadata value.
          - generic [ref=f4e1483]:
            - code [ref=f4e1484]:
              - generic [ref=f4e1485]: "{ \"method\": \"thread/metadata/update\", \"id\": 21, \"params\": {"
              - generic [ref=f4e1486]: "\"threadId\": \"thr_123\","
              - generic [ref=f4e1487]: "\"isPinned\": true,"
              - generic [ref=f4e1488]: "\"gitInfo\": { \"branch\": \"feature/sidebar-pr\" }"
              - generic [ref=f4e1489]: "} }"
              - generic [ref=f4e1490]: "{ \"id\": 21, \"result\": {"
