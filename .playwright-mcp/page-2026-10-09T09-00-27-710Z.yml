            - generic [ref=f4e2352]: Fuzzy file search events (experimental)
            - button "Copy link to Fuzzy file search events (experimental)" [ref=f4e2353] [cursor=pointer]
          - paragraph [ref=f4e2356]: "The fuzzy file search session API emits per-query notifications:"
