    - main [ref=f4e146]:
      - generic [ref=f4e149]:
        - generic [ref=f4e151]:
          - heading "Codex App Server" [level=1] [ref=f4e153]
          - paragraph [ref=f4e154]: Embed Codex into your product with the app-server protocol
          - button "Copy Page" [ref=f4e158] [cursor=pointer]
        - article [ref=f4e163]:
          - paragraph [ref=f4e164]:
            - text: "Codex app-server is the interface Codex uses to power rich clients (for example, the Codex VS Code extension). Use it when you want a deep integration inside your own product: authentication, conversation history, approvals, and streamed agent events. The app-server implementation is open source in the Codex GitHub repository ("
            - link "openai/codex/codex-rs/app-server" [ref=f4e165] [cursor=pointer]:
              - /url: https://github.com/openai/codex/tree/main/codex-rs/app-server
            - text: ). See the
            - link "Open Source" [ref=f4e166] [cursor=pointer]:
              - /url: /docs/open-source
            - text: page for the full list of open-source Codex components.
          - paragraph [ref=f4e174]:
            - text: If you are automating jobs or running Codex in CI, use the
            - link "Codex SDK" [ref=f4e175] [cursor=pointer]:
              - /url: /docs/codex-sdk
            - text: instead.
          - heading "Connect the CLI terminal UI Copy link to Connect the CLI terminal UI" [level=2] [ref=f4e176]:
            - generic [ref=f4e177]: Connect the CLI terminal UI
            - button "Copy link to Connect the CLI terminal UI" [ref=f4e178] [cursor=pointer]
          - paragraph [ref=f4e181]: "Remote terminal UI mode lets you run app-server on one machine and connect the Codex CLI terminal interface from another. Start a WebSocket listener:"
          - generic [ref=f4e182]:
            - code [ref=f4e183]:
              - generic [ref=f4e184]: codex app-server --listen ws://127.0.0.1:4500
            - generic [ref=f4e185]:
              - button "Copy code to clipboard" [ref=f4e186] [cursor=pointer]
              - status [ref=f4e189]
          - paragraph [ref=f4e190]: "Then connect the terminal UI:"
          - generic [ref=f4e191]:
            - code [ref=f4e192]:
              - generic [ref=f4e193]: codex --remote ws://127.0.0.1:4500
            - generic [ref=f4e194]:
              - button "Copy code to clipboard" [ref=f4e195] [cursor=pointer]
              - status [ref=f4e198]
          - paragraph [ref=f4e199]: "For a non-local connection, configure WebSocket authentication and put the connection behind TLS. Store the bearer token in an environment variable and pass its name instead of putting the token on the command line:"
          - generic [ref=f4e200]:
            - code [ref=f4e201]:
              - generic [ref=f4e202]: export CODEX_REMOTE_TOKEN="$(cat "$HOME/.codex/app-server-token")"
              - generic [ref=f4e203]: codex --remote wss://remote-host:4500 \
              - generic [ref=f4e204]: "--remote-auth-token-env CODEX_REMOTE_TOKEN"
            - generic [ref=f4e205]:
              - button "Copy code to clipboard" [ref=f4e206] [cursor=pointer]
              - status [ref=f4e209]
          - paragraph [ref=f4e210]:
            - text: The
            - code [ref=f4e211]: "--remote"
            - text: option accepts
            - code [ref=f4e212]: ws://
            - text: ","
            - code [ref=f4e213]: wss://
            - text: ","
            - code [ref=f4e214]: unix://
            - text: ", and"
            - code [ref=f4e215]: unix://PATH
            - text: endpoints. Use plain WebSockets only for localhost or an SSH port-forwarded connection.
          - heading "Connect a remote Code Mode host Copy link to Connect a remote Code Mode host" [level=2] [ref=f4e216]:
            - generic [ref=f4e217]: Connect a remote Code Mode host
            - button "Copy link to Connect a remote Code Mode host" [ref=f4e218] [cursor=pointer]
          - paragraph [ref=f4e221]: "By default, app-server starts a local Code Mode host. To use a remote host instead, pass its secure WebSocket URL:"
          - generic [ref=f4e222]:
            - code [ref=f4e223]:
              - generic [ref=f4e224]: codex app-server --code-mode-host wss://code-mode.example.com/host
            - generic [ref=f4e225]:
              - button "Copy code to clipboard" [ref=f4e226] [cursor=pointer]
              - status [ref=f4e229]
          - paragraph [ref=f4e230]:
            - code [ref=f4e231]: "--code-mode-host"
            - text: controls the outbound connection from app-server to its Code Mode host. It doesn’t change
            - code [ref=f4e232]: "--listen"
            - text: ", which controls how clients connect to app-server. Every thread in the same app-server process shares the selected Code Mode host connection."
          - paragraph [ref=f4e233]:
            - text: Use
            - code [ref=f4e234]: wss://
            - text: for a remote host. Use
            - code [ref=f4e235]: ws://
            - text: only for a localhost or SSH-forwarded connection. The app-server command and WebSocket transport are experimental and aren’t supported for production workloads.
          - heading "Protocol Copy link to Protocol" [level=2] [ref=f4e236]:
            - generic [ref=f4e237]: Protocol
            - button "Copy link to Protocol" [ref=f4e238] [cursor=pointer]
          - paragraph [ref=f4e241]:
            - text: Like
            - link "MCP" [ref=f4e242] [cursor=pointer]:
              - /url: https://modelcontextprotocol.io/
            - text: ","
            - code [ref=f4e243]: codex app-server
            - text: supports bidirectional communication using JSON-RPC 2.0 messages (with the
            - code [ref=f4e244]: "\"jsonrpc\":\"2.0\""
            - text: header omitted on the wire).
          - paragraph [ref=f4e245]: "Supported transports:"
          - list [ref=f4e246]:
            - listitem [ref=f4e247]:
              - code [ref=f4e248]: stdio
              - text: (
              - code [ref=f4e249]: "--listen stdio://"
              - text: ", default): newline-delimited JSON (JSONL)."
            - listitem [ref=f4e250]:
              - code [ref=f4e251]: websocket
              - text: (
              - code [ref=f4e252]: "--listen ws://IP:PORT"
              - text: ", experimental and unsupported): one JSON-RPC message per WebSocket text frame."
            - listitem [ref=f4e253]:
              - text: Unix socket (
              - code [ref=f4e254]: "--listen unix://"
              - text: or
              - code [ref=f4e255]: "--listen unix://PATH"
              - text: "): WebSocket connections over Codex’s default app-server control socket or a custom Unix socket path, using the standard HTTP Upgrade handshake."
            - listitem [ref=f4e256]:
              - code [ref=f4e257]: "off"
              - text: (
              - code [ref=f4e258]: "--listen off"
              - text: "): don’t expose a local transport."
          - paragraph [ref=f4e259]:
            - text: When you run with
            - code [ref=f4e260]: "--listen ws://IP:PORT"
            - text: ", the same listener also serves basic HTTP health probes:"
          - list [ref=f4e261]:
            - listitem [ref=f4e262]:
              - code [ref=f4e263]: GET /readyz
              - text: returns
              - code [ref=f4e264]: 200 OK
              - text: once the listener accepts new connections.
            - listitem [ref=f4e265]:
              - code [ref=f4e266]: GET /healthz
              - text: returns
              - code [ref=f4e267]: 200 OK
              - text: when the request doesn’t include an
              - code [ref=f4e268]: Origin
              - text: header.
            - listitem [ref=f4e269]:
              - text: Requests with an
              - code [ref=f4e270]: Origin
              - text: header are rejected with
              - code [ref=f4e271]: 403 Forbidden
              - text: .
          - paragraph [ref=f4e272]:
            - text: WebSocket transport is experimental and unsupported. Local listeners such as
            - code [ref=f4e273]: ws://127.0.0.1:PORT
            - text: are appropriate for localhost and SSH port-forwarding workflows. Non-loopback WebSocket listeners currently allow unauthenticated connections by default during rollout, so configure WebSocket auth before exposing one remotely.
          - paragraph [ref=f4e274]: "Supported WebSocket auth flags:"
          - list [ref=f4e275]:
            - listitem [ref=f4e276]:
              - code [ref=f4e277]: "--ws-auth capability-token --ws-token-file /absolute/path"
            - listitem [ref=f4e278]:
              - code [ref=f4e279]: "--ws-auth capability-token --ws-token-sha256 HEX"
            - listitem [ref=f4e280]:
              - code [ref=f4e281]: "--ws-auth signed-bearer-token --ws-shared-secret-file /absolute/path"
          - paragraph [ref=f4e282]:
            - text: For signed bearer tokens, you can also set
            - code [ref=f4e283]: "--ws-issuer"
            - text: ","
            - code [ref=f4e284]: "--ws-audience"
            - text: ", and"
            - code [ref=f4e285]: "--ws-max-clock-skew-seconds"
            - text: . Clients present the credential as
            - code [ref=f4e286]: "Authorization: Bearer <token>"
            - text: during the WebSocket handshake, and app-server enforces auth before JSON-RPC
            - code [ref=f4e287]: initialize
            - text: .
          - paragraph [ref=f4e288]:
            - text: Prefer
            - code [ref=f4e289]: "--ws-token-file"
            - text: over passing raw bearer tokens on the command line. Use
            - code [ref=f4e290]: "--ws-token-sha256"
            - text: only when the client keeps the raw high-entropy token in a separate local secret store; the hash is only a verifier, and clients still need the original token.
          - paragraph [ref=f4e291]:
            - text: In WebSocket mode, app-server uses bounded queues. When request ingress is full, the server rejects new requests with JSON-RPC error code
            - code [ref=f4e292]: "-32001"
            - text: and message
            - code [ref=f4e293]: "\"Server overloaded; retry later.\""
            - text: Clients should retry with an exponentially increasing delay and jitter.
          - heading "Message schema Copy link to Message schema" [level=2] [ref=f4e294]:
            - generic [ref=f4e295]: Message schema
            - button "Copy link to Message schema" [ref=f4e296] [cursor=pointer]
          - paragraph [ref=f4e299]:
            - text: Requests include
            - code [ref=f4e300]: method
